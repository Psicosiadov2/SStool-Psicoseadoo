<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading UI...</title>
<!-- Standalone offline intro. No images or external dependencies.
Continuous preview until the host calls window.SSToolIntro.finish().
finish() fades out and emits 'sstool:intro-complete'. play() restarts.
-->
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#050506}body{font-family:'Segoe UI',sans-serif}.intro{position:fixed;inset:0;isolation:isolate;background:radial-gradient(ellipse at 50% 48%,#111113 0,#080808 40%,#040405 85%);opacity:1;transition:opacity .45s ease}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,#0005 100%);pointer-events:none}.message{position:absolute;inset:0;display:grid;place-items:center;margin:0;color:#eeeeee;font-size:clamp(13px,1.15vw,17px);font-weight:500;letter-spacing:.35px;text-shadow:0 0 18px #ffffff20;animation:appear .8s ease both}.message span{animation:breathe 3.2s 1s ease-in-out infinite}.intro.finished{opacity:0;pointer-events:none}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}

.loading{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:23px;animation:appear 1.1s cubic-bezier(.2,.7,.2,1) both}
.message{position:static;display:block;inset:auto;font-size:14px;letter-spacing:1.3px;font-weight:400;color:#e5e5e5;animation:none}
 .loader{width:58px;height:58px;position:relative;animation:constellation-turn 8s linear infinite}
.loader i{position:absolute;left:26px;top:26px;width:6px;height:6px;border-radius:50%;background:#dedede;transform:rotate(calc(var(--i)*30deg)) translateY(-23px);animation:dot-wave 1.5s linear infinite;animation-delay:calc(var(--i)*.125s - 1.5s)}
@keyframes dot-wave{0%,100%{opacity:1;box-shadow:0 0 7px #ffffff55}65%{opacity:.12;box-shadow:0 0 0 transparent}}
@keyframes constellation-turn{to{transform:rotate(360deg)}}
.intro:before{content:'';position:absolute;width:52vw;height:52vw;max-width:750px;max-height:750px;left:50%;top:50%;border-radius:50%;background:radial-gradient(circle,#ffffff05,transparent 68%);transform:translate(-50%,-50%);animation:aura 7s ease-in-out infinite;pointer-events:none}
@keyframes rotate{to{transform:rotate(360deg)}}@keyframes core-pulse{0%,100%{opacity:.35;transform:scale(.65)}50%{opacity:.9;transform:scale(1)}}@keyframes aura{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.85)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}}

</style></head><body><main class="intro" id="intro" aria-label="Loading UI"><canvas id="stars" aria-hidden="true"></canvas><div class="shade"></div><div class="loading" role="status"><div class="loader" aria-hidden="true"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i></div><p class="message"><span>Loading UI...</span></p></div></main>
<script>
'use strict';
const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d'),intro=document.querySelector('#intro');
let width=0,height=0,stars=[],raf=0,last=0,elapsed=0,active=true,finishTimer,meteors=[],nextMeteor=1.2;
function star(initial=true){const depth=Math.random();return{x:Math.random()*width,y:initial?Math.random()*height:-15,depth,r:.35+depth*1.05,speed:65+depth*125,alpha:.16+depth*.48,phase:Math.random()*Math.PI*2,drift:(Math.random()-.5)*8}}
function resize(){width=innerWidth;height=innerHeight;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.max(60,Math.min(230,Math.round(width*height/6400)))},()=>star());paint(0)}
function paint(dt){if(!ctx)return;ctx.clearRect(0,0,width,height);elapsed+=dt;for(const s of stars){if(dt){s.y+=s.speed*dt;s.x+=(s.speed*.06+Math.sin(elapsed*.35+s.phase)*s.drift)*dt;if(s.y>height+15){Object.assign(s,star(false))}if(s.x>width+10)s.x=-5}const twinkle=.76+.24*Math.sin(elapsed*1.4+s.phase);ctx.globalAlpha=s.alpha*twinkle;ctx.fillStyle='#eeeeee';if(s.depth>.78){const length=3+s.depth*5;ctx.strokeStyle='#ffffff30';ctx.lineWidth=s.r*.6;ctx.beginPath();ctx.moveTo(s.x-length*.1,s.y-length);ctx.lineTo(s.x,s.y);ctx.stroke()}ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();if(s.depth>.95){ctx.globalAlpha=s.alpha*.2*twinkle;ctx.beginPath();ctx.arc(s.x,s.y,s.r*3.3,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;
if(dt&&elapsed>nextMeteor){meteors.push({x:Math.random()*width,y:-30,life:0,duration:.85+Math.random()*.5,speed:350+Math.random()*200});nextMeteor=elapsed+1.7+Math.random()*2.2}
for(let i=meteors.length-1;i>=0;i--){const m=meteors[i];m.life+=dt;m.x+=m.speed*.28*dt;m.y+=m.speed*dt;if(m.life>m.duration){meteors.splice(i,1);continue}const a=Math.sin(Math.PI*m.life/m.duration)*.45;const tail=65;const gradient=ctx.createLinearGradient(m.x-tail*.28,m.y-tail,m.x,m.y);gradient.addColorStop(0,'rgba(255,255,255,0)');gradient.addColorStop(1,'rgba(255,255,255,'+a+')');ctx.strokeStyle=gradient;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(m.x-tail*.28,m.y-tail);ctx.lineTo(m.x,m.y);ctx.stroke();ctx.fillStyle='rgba(255,255,255,'+a+')';ctx.beginPath();ctx.arc(m.x,m.y,1.2,0,Math.PI*2);ctx.fill()}
}
function frame(time){raf=0;if(!active||document.hidden)return;const dt=last?Math.min((time-last)/1000,.045):0;last=time;paint(dt);raf=requestAnimationFrame(frame)}
function resume(){cancelAnimationFrame(raf);last=0;if(active&&!document.hidden)raf=requestAnimationFrame(frame);else if(active)paint(0)}
function play(){clearTimeout(finishTimer);active=true;intro.classList.remove('finished');elapsed=0;meteors=[];nextMeteor=1.2;resize();resume()}
function finish(){if(!active)return;active=false;cancelAnimationFrame(raf);intro.classList.add('finished');finishTimer=setTimeout(()=>window.dispatchEvent(new CustomEvent('sstool:intro-complete')),450)}
window.SSToolIntro={play,finish};window.addEventListener('resize',resize);document.addEventListener('visibilitychange',resume);play();
</script></body></html>
