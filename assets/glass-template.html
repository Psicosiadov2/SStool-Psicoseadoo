.window{background-image:linear-gradient(115deg,rgba(34,34,34,.75),rgba(21,21,21,.72) 45%,rgba(57,57,57,.62)),var(--scene);background-size:cover;background-position:center}

.card:hover{background:linear-gradient(125deg,#525252cc,#3c3c3cbf)}
.card span{color:#dddddd}.caption{color:#d4d4d4}.footer{color:#d1d1d1}.tab{color:#dddddd}.nav{background:#14141445}.search{background:#1818189c}.eyebrow{color:#d0d0d0}

/* Monochrome glass with the supplied artwork preserved in full color bytes. */
:root{--text:#f5f5f5;--muted:#b5b5b5;--edge:rgba(255,255,255,.2);--blue:#fff}
body{background-image:linear-gradient(120deg,#0007,#000a),var(--scene);background-color:#000;background-position:center;background-size:cover}
body:before{background:linear-gradient(125deg,#ffffff05,transparent 45%,#0005)}
.window{background-image:linear-gradient(115deg,#08080855,#08080888 48%,#15151599),var(--scene);background-position:center;background-size:cover;border-color:#ffffff50;box-shadow:inset 0 1px 1px #ffffff8c,inset 0 -1px 1px #ffffff18,0 38px 100px #000c,0 0 45px #ffffff08}
.window:before{background:linear-gradient(125deg,#ffffff09,transparent 38%,#ffffff06 65%,transparent)}
.card{background:linear-gradient(125deg,#262626ad,#131313b3);border-color:#ffffff2e;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.card:hover{background:linear-gradient(125deg,#414141c9,#242424bf);border-color:#ffffff85}
.card.chosen{border-color:#eee;box-shadow:0 0 0 2px #ffffff14,inset 0 0 24px #ffffff10}
.tab[aria-selected=true]{color:#fff;text-shadow:0 0 14px #ffffff55;background:linear-gradient(0deg,#ffffff20,transparent 90%)}
.tab[aria-selected=true]:after{background:linear-gradient(90deg,#999,#fff,#999);box-shadow:0 0 9px 2px #ffffff50,0 0 25px 5px #ffffff15}
#status:before{background:#eee;box-shadow:0 0 8px #ffffff60}.search:focus{border-color:#ddd;box-shadow:0 0 0 3px #ffffff12}.window-controls button:last-child:hover{background:#ffffff24}

<body><section class="window" aria-label="RF Forensics">
<header class="titlebar" id="titlebar"><div class="brand">RF Forensics</div><div class="window-controls"><button data-window="minimize">Minimizar</button><button data-window="maximize">Maximizar</button><button data-window="close">Cerrar</button></div></header>
<nav class="nav" role="tablist" aria-label="Categorías"></nav>
<main id="panel" role="tabpanel" tabindex="0"><div class="heading"><div><span class="eyebrow">RF / Workspace</span><h1 id="heading">Scripts</h1></div><div class="heading-right"><span class="caption">Contact: Psicoseado</span><input class="search" id="search" type="search" placeholder="Buscar herramienta…" aria-label="Buscar en esta categoría" autocomplete="off"></div></div><div class="grid" id="grid"></div></main>
<footer class="footer"><span id="status" role="status" aria-live="polite">Vista previa · Selecciona una herramienta</span><small>Monochrome edition</small></footer>
</section>
<script>
'use strict';
const categories={
'Orbdiff/Others':[['usb-deview','USB Deview','Consulta dispositivos USB.'],['browser-downloads','BrowserDownloadsView','Consulta descargas del navegador.'],['p1ae','P1AE Scanner','Análisis de memoria Java.'],['redlotus','RedLotus Mod Analyzer','Análisis de modificaciones.']],
'MeowTonynoh':[['meow-mod','Meow Mod Analyzer','Análisis de mods y archivos.']],
'Spokwn':[['journaltrace','JournalTrace','Consulta del diario NTFS.'],['kerneldump','KernelDumpTool','Herramienta de volcado del kernel.']],
'Scripts':[['agua','AguaScript','Detects multiple threats.\nUsing a PowerShell script.'],['lilith','Lilith Script',"Detects threats on a user’s PC."],['lilith-services','Lilith Services Enabler','Enable/Disable services.'],['red-doomsday','Red Doomsday Detector','Detects Doomsday client.'],['lilith-doomsday','Lilith DoomsDay Finder','Fast script to detect client.'],['vpn','VPN Detector','Detects active VPN/Proxy.'],['recording','RecordingKiller','Kill recording processes.'],['habibi','Habibi Mod Analyzer','Analyze mods and strings.'],['macro','Macro Catcher','Detects mouse macros.']],
'Other Tools':[['jarabel','Jarabel','Inspección de archivos Java.'],['luyten','Luyten','Visualización de código Java.'],['everything','Everything','Búsqueda de archivos.'],['system-informer','System Informer','Inspección de procesos del sistema.']],
'Dependencies':[['dotnet10','.NET 10 SDK','Dependencia para Windows x64.'],['dotnet9','.NET 9 SDK','Dependencia para Windows x64.'],['vcredist','Visual C++ Runtime','Dependencia para Windows x64.'],['java','Java','Entorno de ejecución Java.']]
};
const nav=document.querySelector('.nav'),grid=document.querySelector('#grid'),panel=document.querySelector('#panel');
let selected='Scripts';
function setStatus(message){document.querySelector('#status').textContent=String(message)}
function send(message){
 if(window.chrome?.webview){window.chrome.webview.postMessage(message);return true}
 if(typeof window.desktopBridge?.send==='function'){window.desktopBridge.send(message);return true}
 window.dispatchEvent(new CustomEvent('rf-action',{detail:message}));return false;
}
function select(category){selected=category;document.querySelector('#heading').textContent=category;
 [...nav.children].forEach(b=>{const active=b.dataset.category===category;b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;if(active)panel.setAttribute('aria-labelledby',b.id)});
 grid.replaceChildren();let index=0;const query=document.querySelector('#search').value.trim().toLocaleLowerCase();for(const [id,name,description] of categories[category].filter(item=>item.slice(1).join(' ').toLocaleLowerCase().includes(query))){const button=document.createElement('button');button.className='card reveal';button.style.setProperty('--delay',(index++*28)+'ms');button.addEventListener('animationend',()=>button.classList.remove('reveal'),{once:true});const title=document.createElement('strong');title.textContent=name;const desc=document.createElement('span');desc.textContent=description;button.append(title,desc);button.onclick=()=>{grid.querySelectorAll('.chosen').forEach(el=>el.classList.remove('chosen'));button.classList.add('chosen');try{const connected=send({type:'launch-tool',id,category:selected});setStatus(connected?'Solicitud enviada: '+name:'Vista previa: '+name+' · Conecta este botón desde tu ejecutable.')}catch(e){setStatus('No se pudo enviar la solicitud al ejecutable.')}};grid.append(button)}
 if(!grid.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='No se encontraron herramientas en esta categoría.';grid.append(empty)}
}
Object.keys(categories).forEach((name,i)=>{const b=document.createElement('button');b.className='tab';b.id='tab-'+i;b.dataset.category=name;b.textContent=name;b.setAttribute('role','tab');b.setAttribute('aria-controls','panel');b.onclick=()=>{document.querySelector('#search').value='';select(name)};nav.append(b)});
nav.addEventListener('keydown',e=>{const tabs=[...nav.children];let i=tabs.indexOf(document.activeElement);if(i<0)return;if(e.key==='ArrowRight')i=(i+1)%tabs.length;else if(e.key==='ArrowLeft')i=(i+tabs.length-1)%tabs.length;else if(e.key==='Home')i=0;else if(e.key==='End')i=tabs.length-1;else return;e.preventDefault();tabs[i].click();tabs[i].focus()});
document.querySelectorAll('[data-window]').forEach(b=>b.onclick=async()=>{try{if(send({type:'window-control',action:b.dataset.window}))return;if(b.dataset.window==='maximize'){if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}else setStatus('Vista previa · '+b.textContent+' estará disponible al integrar la ventana nativa.')}catch(e){setStatus('Esta función requiere integración con la ventana del ejecutable.')}});
document.querySelector('#search').addEventListener('input',()=>select(selected));
document.querySelector('#search').addEventListener('keydown',e=>{if(e.key==='Escape'){e.target.value='';select(selected)}});
if(matchMedia('(hover:hover) and (prefers-reduced-motion:no-preference)').matches){grid.addEventListener('pointermove',e=>{const card=e.target.closest('.card');if(!card)return;const rect=card.getBoundingClientRect();card.style.setProperty('--mx',((e.clientX-rect.left)/rect.width*100)+'%');card.style.setProperty('--my',((e.clientY-rect.top)/rect.height*100)+'%')})}
document.addEventListener('fullscreenchange',()=>{document.querySelector('[data-window="maximize"]').textContent=document.fullscreenElement?'Restaurar':'Maximizar'});
window.RFGlass={setStatus};select(selected);
</script></body></html>
